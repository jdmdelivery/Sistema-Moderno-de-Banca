# NOTA: no se fija org.gradle.jvmargs a propósito. En esta VM el enlace
# entre el cliente de Gradle y su demonio bifurcado falla ("Could not
# receive a message from the daemon"); sin jvmargs propios, el build de
# un solo uso corre en el mismo proceso. La memoria se acota con
# GRADLE_OPTS en build-apk.sh.
org.gradle.parallel=false
android.useAndroidX=false
